
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro | TEAjuda</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-publica">

    <main class="login-container">

        <div class="logo">
            <h1><span>TEA</span>ajuda</h1>
            <p>Onde dúvidas encontram acolhimento.</p>
        </div>

        <h2>Crie sua conta 💙</h2>

        <form id="form-cadastro">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome completo"
                autocomplete="name"
                required
            >

            <label for="email-cadastro">E-mail</label>
            <input
                type="email"
                id="email-cadastro"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
            >

            <label for="senha-cadastro">Senha</label>
            <input
                type="password"
                id="senha-cadastro"
                placeholder="Crie uma senha"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmar-senha">
                Confirmar senha
            </label>
            <input
                type="password"
                id="confirmar-senha"
                placeholder="Digite a senha novamente"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <p id="mensagem-cadastro"
               class="mensagem-erro"
               role="status"
               aria-live="polite"></p>

            <button type="submit" class="botao">
                Criar minha conta
            </button>

        </form>

        <div class="links-login">
            <a href="login.html">
                Já tenho uma conta — Entrar
            </a>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
