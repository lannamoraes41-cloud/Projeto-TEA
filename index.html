<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo | TEAjuda</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="fundo.css">
</head>

<body class="pagina-publica">

  <div class="forma forma-amarela"></div>
  <div class="forma forma-azul"></div>

  <main class="apresentacao">

    <header class="cabecalho">
      <img
        class="logo"
        src="img/logo-TEAajuda.png"
        alt="TEAjuda — Onde dúvidas encontram acolhimento"
      >

      <span class="selo">
        Informação • Apoio • Conexão
      </span>
    </header>

    <section class="hero">

      <div class="hero-conteudo">
        <p class="eyebrow">
          Um espaço feito para acolher
        </p>

        <h1>
          Bem-vindo(a) ao
          <strong>TEAjuda!</strong>
        </h1>

        <p class="descricao">
          Informação, apoio e conexão para pessoas
          que vivem ou se relacionam com o autismo.
        </p>

        <p class="mensagem">
          Cada pessoa importa.<br>
          <span>Cada história inspira.</span>
        </p>

        <a href="login.html" class="botao">
          Começar
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <div class="hero-ilustracao">
        <img
          src="img/ilustracao-teajuda.png"
          alt="Pessoa adulta acolhendo uma criança"
        >

        <div class="cartao-flutuante">
          <span>♡</span>

          <p>
            Juntos por mais<br>
            <strong>compreensão</strong>
          </p>
        </div>
      </div>

    </section>

    
  </main>

</body>
</html>
