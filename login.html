
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Login | TEAjuda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-publica">

    <main class="login-container">

        
<div class="logo-publica">
    <img
        src="img/logo-TEAajuda.png"
        alt="TEAjuda - Onde dúvidas encontram acolhimento"
    >
</div>


        <h2>Entrar na minha conta</h2>

        <form id="form-login">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <p id="mensagem-login"
               class="mensagem-erro"
               role="status"
               aria-live="polite"></p>

            <button type="submit" class="botao">
                Entrar
            </button>

        </form>

        <div class="links-login">
            <a href="cadastro.html">
                Criar uma conta
            </a>

            <a href="recuperar-senha.html">
                Esqueceu sua senha?
            </a>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
